<script type="text/javascript">
    RED.nodes.registerType("foxess-real", {
        category: "FoxESS",
        color: "#F3B567",
        defaults: {
            name: { value: "" },
            server: { value: "", type: "foxess-config", required: true },
            interval: { value: 300, validate: function (v) { return v === "" || (Number(v) === 0 || Number(v) >= 60); } },
            minElevation: { value: "", validate: function (v) { return v === "" || (Number(v) >= -90 && Number(v) <= 90); } },
            locationEnv: { value: "location" },
            variables: { value: "pvPower, loadsPower, feedinPower, gridConsumptionPower, SoC, batChargePower, batDischargePower" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sun-o",
        label: function () {
            return this.name || "FoxESS real-time";
        },
        paletteLabel: "real-time"
    });
</script>

<script type="text/html" data-template-name="foxess-real">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-cloud"></i> Account</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-interval"><i class="fa fa-repeat"></i> Poll every</label>
        <input type="number" id="node-input-interval" min="0" step="1" style="width: 100px"> seconds
        <div class="form-tips">0 = only poll when a message arrives. Minimum 60.</div>
    </div>
    <div class="form-row">
        <label for="node-input-minElevation"><i class="fa fa-sun-o"></i> Sun above</label>
        <input type="number" id="node-input-minElevation" min="-90" max="90" step="1" style="width: 100px" placeholder="always"> degrees
        <div class="form-tips">Only poll on the timer while the sun is at least this high. Blank = poll around the clock.</div>
    </div>
    <div class="form-row">
        <label for="node-input-locationEnv"><i class="fa fa-map-marker"></i> Location env</label>
        <input type="text" id="node-input-locationEnv" placeholder="location">
    </div>
    <div class="form-row">
        <label for="node-input-variables"><i class="fa fa-list"></i> Variables</label>
        <input type="text" id="node-input-variables" placeholder="blank = all variables">
    </div>
</script>

<script type="text/html" data-help-name="foxess-real">
    <p>Reads real-time inverter data from the FoxESS Cloud and works out how much power is going to the grid.</p>

    <h3>Inputs</h3>
    <p>Any message triggers an immediate poll.</p>
    <dl class="message-properties">
        <dt class="optional">sn <span class="property-type">string</span></dt>
        <dd>Overrides the inverter serial number for this poll.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>One property per variable, e.g. <code>payload.pvPower</code>, <code>payload.SoC</code>, plus:
            <ul>
                <li><code>gridPower</code>: <code>feedinPower - gridConsumptionPower</code> in kW.
                    Positive = exporting surplus to the grid, negative = importing.</li>
            </ul>
        </dd>
        <dt>units <span class="property-type">object</span></dt>
        <dd>Unit for each variable.</dd>
        <dt>time <span class="property-type">string</span></dt>
        <dd>Time the inverter last reported to the cloud.</dd>
        <dt>deviceSN <span class="property-type">string</span></dt>
        <dd>Inverter serial number.</dd>
        <dt class="optional">sun <span class="property-type">object</span></dt>
        <dd><code>{ elevation, up }</code> when <i>Sun above</i> is set. <code>elevation</code> is in degrees,
            <code>up</code> is whether it's at or above the threshold.</dd>
    </dl>

    <h3>Details</h3>
    <p>The FoxESS API allows about 1440 calls per inverter per day, so the interval can't be below 60 seconds.
       Most data loggers only upload every few minutes, so 300 seconds is usually enough; check <code>msg.time</code>
       to see how fresh the data is.</p>
    <h3>Sun-based polling</h3>
    <p>Set <i>Sun above</i> to only poll while the sun is at least that many degrees above the horizon
       (e.g. 20). The timer keeps running at night but makes no API calls.
       When the sun drops below the threshold the node sends one message with an empty <code>payload</code> and
       <code>msg.sun.up = false</code>, so flows can switch things off. Messages sent to the node's input
       always poll, whatever the sun is doing.</p>
    <p>The location comes from the environment variable named in <i>Location env</i> (default <code>location</code>),
       set on the flow, group or in the global environment (<i>Settings &gt; Environment</i>).
       Accepted formats: <code>-33.86,151.21</code>, <code>-33.86 151.21</code>, <code>[-33.86,151.21]</code>
       or <code>{"lat":-33.86,"lon":151.21}</code>.</p>
    <p><code>feedinPower</code> and <code>gridConsumptionPower</code> are always requested so <code>gridPower</code> can be calculated.
       Leave <i>Variables</i> blank to fetch everything the inverter reports.</p>
</script>
