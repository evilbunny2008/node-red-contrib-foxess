name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets GitHub prove to npm who is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      # Use the release tag (v1.2.3 or 1.2.3) as the package version
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm publish --access public
