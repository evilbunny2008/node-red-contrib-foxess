name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets GitHub prove to npm who is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # Use the release tag (v1.2.3 or 1.2.3) as the package version
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm publish --access public
      # The Flow Library only picks up new versions when its "add node" form is submitted, so do that here.
      # npm can take a minute or two to report the new version, so retry while it says "already at latest".
      - name: Refresh flows.nodered.org
        continue-on-error: true
        run: |
          name=$(node -p "require('./package.json').name")
          for attempt in 1 2 3 4 5; do
            sleep 60
            token=$(curl -sf -c jar.txt https://flows.nodered.org/add/node | sed -n 's/.*name="_csrf" type="hidden" value="\([^"]*\)".*/\1/p')
            result=$(curl -s -b jar.txt -w '\n%{http_code}' --data-urlencode "module=$name" --data-urlencode "_csrf=$token" https://flows.nodered.org/add/node)
            echo "Attempt $attempt: $result"
            [ "$(echo "$result" | tail -1)" = "200" ] && exit 0
          done
          exit 1
